name: fleming-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fleming
      POSTGRES_PASSWORD: fleming-local-only
      POSTGRES_DB: fleming_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - fleming-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleming -d fleming_local"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  fleming-local-data:
