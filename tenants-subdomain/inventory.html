<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Review your inventory · Fleming Lettings</title><link rel="stylesheet" href="/form-typography.css"><style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px;min-height:100vh;background:linear-gradient(135deg,#25073b,#dc006d);font-family:Arial,sans-serif}.shell{max-width:800px;margin:auto;border-radius:20px;overflow:hidden;background:white}.top{padding:24px 30px;background:linear-gradient(120deg,#25073b,#a32372);display:flex;align-items:center;justify-content:space-between}.top img{width:160px}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff70;border-radius:24px;padding:9px 14px}.content{padding:30px}h1{font-size:30px}h2{font-size:20px}p{line-height:1.6}.notice{padding:18px;border-radius:12px;background:#fce9f2;margin:20px 0}.photo{border:1px solid #ddd;border-radius:14px;padding:16px;margin:20px 0}.photo img{display:block;width:100%;max-height:450px;object-fit:contain;background:#f6f4f7;border-radius:10px}.photo h3{font-size:16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,.button{display:inline-block;cursor:pointer;background:#27083d;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;text-decoration:none}button:disabled{opacity:.5;cursor:default}.approve{background:#166534}input,textarea{width:100%;border:1px solid #cfc8d1;border-radius:10px;padding:12px;font:16px Arial;margin:8px 0}textarea{min-height:85px}label{font-size:14px;font-weight:600}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}.status{color:#166534;font-weight:600}.error{color:#991b1b}.sticky{position:sticky;top:0;background:#fff;padding:12px 0;border-bottom:1px solid #eee;z-index:2}.extra{border:1px dashed #a32372;padding:20px;border-radius:12px}.signed{background:#ecfdf3;color:#166534;padding:20px;border-radius:12px}@media(max-width:520px){body{padding:10px}.content,.top{padding:20px}.top img{width:130px}h1{font-size:25px}}
</style></head><body><main class="shell"><header class="top"><img src="/logo-white.png" alt="Fleming Lettings"><a href="https://fleminglettings.co.uk">🏠 Website</a></header><section class="content"><h1>Your property inventory</h1><p id="loading">Loading your inventory…</p><div id="body" hidden><p id="address"></p><p id="dates"></p><div id="signed" hidden class="signed"></div><div id="pdf" hidden><a id="pdf-link" class="button">Download completed inventory PDF</a><p>Review the PDF, then add any discrepancies below before signing.</p></div><p class="sticky" id="progress"></p><div id="photos"></div><h2>Your additional photos and comments</h2><div id="own"></div><form id="extra" class="extra"><label for="caption">Describe a discrepancy or missing item</label><textarea id="caption" maxlength="4000" required></textarea><label for="file">Add a photo (up to 10 MB)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><button>Add photo</button></form><form id="sign"><label for="comments">Other comments (optional)</label><textarea id="comments" maxlength="12000"></textarea><div class="notice" id="disclaimer"></div><label for="name">Your full name</label><input id="name" autocomplete="name" required maxlength="200"><label><input type="checkbox" id="confirmed" required> I have reviewed this inventory and confirm that my comments and additional photos form part of my signed response.</label><p><button id="sign-button">Sign and submit review</button></p></form></div><p id="message" role="status"></p></section></main><script>
const API=location.hostname==='localhost'?'http://localhost:3330':'https://fleming-crm-api.fly.dev';const token=location.pathname.split('/').filter(Boolean).pop();const base=API+'/api/public/inventory/'+encodeURIComponent(token);const $=id=>document.getElementById(id);let data;const dirtyPhotos=new Set();
async function request(url,options={}){const res=await fetch(url,options);const body=await res.json();if(!res.ok)throw new Error(body.error||'Could not save. Please try again.');return body;}
function status(text,error=false){$('message').className=error?'error':'status';$('message').textContent=text;}
function updateProgress(){const remaining=data.photos.filter(p=>!p.approved&&!p.comment?.trim()).length;$('progress').textContent=data.photos.length?`${data.photos.length-remaining} of ${data.photos.length} photos reviewed`:'';$('sign-button').disabled=remaining>0||dirtyPhotos.size>0;}
function ownPhoto(p){const card=document.createElement('div');card.className='photo';const img=new Image();img.loading='lazy';img.src=base+'/own-photos/'+p.id;img.alt=p.caption;const caption=document.createElement('p');caption.textContent=p.caption;card.append(img,caption);$('own').append(card);}
function photo(p){const card=document.createElement('article');card.className='photo';const title=document.createElement('h3');title.textContent=[p.room_name,p.caption].filter(Boolean).join(' — ')||'Inventory photo';const img=new Image();img.loading='lazy';img.src=base+'/photos/'+p.id;img.alt=title.textContent;const label=document.createElement('label');label.textContent='Comments or discrepancies';const input=document.createElement('textarea');input.value=p.comment||'';input.maxLength=4000;input.disabled=!!data.signed_at;label.append(input);const controls=document.createElement('div');controls.className='controls';const approve=document.createElement('button');approve.textContent=p.approved?'✓ Approved':'Approve photo';approve.className='approve';const save=document.createElement('button');save.textContent='Save comment';const saved=document.createElement('span');saved.className='status';if(p.comment)saved.textContent='Comment saved';input.oninput=()=>{if(input.value.trim()!==(p.comment||''))dirtyPhotos.add(p.id);else dirtyPhotos.delete(p.id);saved.textContent=dirtyPhotos.has(p.id)?'Unsaved comment — click Save comment':'';updateProgress();};
async function persist(approved){approve.disabled=save.disabled=true;try{const comment=input.value.trim();if(!approved&&!comment)throw new Error('Add a comment first');await request(base+'/photos/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved,comment})});p.approved=approved;p.comment=comment;dirtyPhotos.delete(p.id);approve.textContent=approved?'✓ Approved':'Approve photo';saved.textContent=comment?'Comment saved':'Approved';updateProgress();status('Review saved');}catch(e){status(e.message,true);}finally{approve.disabled=save.disabled=!!data.signed_at;}}
approve.onclick=()=>persist(true);save.onclick=()=>persist(false);approve.disabled=save.disabled=!!data.signed_at;controls.append(approve,save,saved);card.append(title,img,label,controls);$('photos').append(card);}
async function load(){try{data=await request(base);$('loading').hidden=true;$('body').hidden=false;$('address').textContent=data.inventory.address;$('dates').textContent=`Inspection: ${data.inventory.inspection_date.slice(0,10)} · Review by: ${data.due_date}`;$('disclaimer').textContent=data.disclaimer;$('name').value=data.name;$('comments').value=data.general_comments||'';$('pdf').hidden=!data.has_document;$('pdf-link').href=base+'/document';data.photos.forEach(photo);data.own_photos.forEach(ownPhoto);updateProgress();if(data.signed_at){$('signed').hidden=false;$('signed').textContent='Your signed review was saved on '+new Date(data.signed_at).toLocaleString('en-GB');$('extra').hidden=true;$('sign').hidden=true;}}catch(e){$('loading').textContent=e.message;}}
$('extra').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const payload=new FormData();payload.append('file',$('file').files[0]);payload.append('caption',$('caption').value);const p=await request(base+'/photos',{method:'POST',body:payload});ownPhoto(p);$('extra').reset();status('Photo saved');}catch(err){status(err.message,true);}finally{button.disabled=false;}};
$('sign').onsubmit=async e=>{e.preventDefault();if(dirtyPhotos.size){status('Save each edited photo comment before signing.',true);return;}$('sign-button').disabled=true;try{await request(base+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signature_name:$('name').value,general_comments:$('comments').value,confirmed:$('confirmed').checked})});location.reload();}catch(err){status(err.message,true);updateProgress();}};load();
</script></body></html>
